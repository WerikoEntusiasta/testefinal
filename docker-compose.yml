version: '3.8'

services:
  agropasi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agropasi_app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "80:3000"
      - "8080:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - VENDAS_EMAIL=${VENDAS_EMAIL:-vendas@agropasi.com.br}
      - VENDAS_PASSWORD=${VENDAS_PASSWORD:-Vendas@AgroPasi2026!}
      - DONO_EMAIL=${DONO_EMAIL:-dono@agropasi.com.br}
      - DONO_PASSWORD=${DONO_PASSWORD:-Dono@AgroPasi2026!}
    volumes:
      # Persist SQLite database file and WAL journaling logs
      - ./agropasi.db:/app/agropasi.db
      - ./agropasi.db-wal:/app/agropasi.db-wal
      - ./agropasi.db-shm:/app/agropasi.db-shm
      # Persist uploaded images and CMS assets
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/catalog || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

